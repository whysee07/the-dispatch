name: Daily Brief feed

on:
  schedule:
    - cron: '15 10 * * *'   # 10:15 UTC (~4:15am CT) — primary, off the top of the hour
    - cron: '0 13 * * *'    # 13:00 UTC (~7:00am CT) — backup catch-up (no-op if already fresh)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-brief
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r feeds/brief/requirements.txt

      - name: Skip if today's issue already exists
        id: fresh
        run: |
          if [ -f "data/brief/$(date -u +%F).json" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Today's Brief already exists — skipping generation."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Daily Brief digest
        if: steps.fresh.outputs.run == 'true'
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
          # Email OFF for this feed (web-only). Set to "true" here to re-enable.
          SEND_EMAIL:         "false"
        run: python feeds/brief/digest.py

      - name: Commit issue to archive
        run: |
          git config user.name  "dispatch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brief
          if git diff --staged --quiet; then
            echo "No new issue to commit."; exit 0
          fi
          git commit -m "data(brief): $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Pushed."; exit 0
            fi
            echo "Push race — retrying ($i)..."; sleep $((RANDOM % 6 + 2))
          done
          echo "Failed to push after retries"; exit 1
