name: Culture · Music feed

on:
  schedule:
    - cron: '0 13 * * 5'   # Fridays 13:00 UTC — weekly "Weekend" drop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-culture-music
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r feeds/culture/requirements.txt
      - name: Run Music culture generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CULTURE_MODEL:  gemini-2.5-flash
        run: python feeds/culture/music_culture.py
      - name: Commit issue to archive
        run: |
          git config user.name  "dispatch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/culture/music
          if git diff --staged --quiet; then echo "No new music issue."; exit 0; fi
          git commit -m "data(culture/music): $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then echo "Pushed."; exit 0; fi
            echo "Push race — retrying ($i)..."; sleep $((RANDOM % 6 + 2))
          done
          echo "Failed to push after retries"; exit 1
