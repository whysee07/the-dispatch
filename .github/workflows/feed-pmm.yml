name: PMM feed

on:
  schedule:
    - cron: '35 9 * * *'    # 09:35 UTC (~3:35am CT) — primary, off the top of the hour
    - cron: '40 12 * * *'   # 12:40 UTC (~6:40am CT) — backup catch-up (no-op if already fresh)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-pmm
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r feeds/pmm/requirements.txt

      - name: Skip if today's issue already exists
        id: fresh
        run: |
          if [ -f "data/pmm/$(date -u +%F).json" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Today's Marketing Brief already exists — skipping generation."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PMM digest
        if: steps.fresh.outputs.run == 'true'
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS:        ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:      ${{ secrets.RECIPIENT_EMAIL }}
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT:    pmm_digest_bot/1.0
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          # Email OFF for this feed (web-only). Set to "true" here to re-enable.
          SEND_EMAIL:           "false"
        run: python feeds/pmm/pmm_digest.py

      - name: Commit issue to archive
        run: |
          git config user.name  "dispatch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pmm
          if git diff --staged --quiet; then
            echo "No new issue to commit."; exit 0
          fi
          git commit -m "data(pmm): $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Pushed."; exit 0
            fi
            echo "Push race — retrying ($i)..."; sleep $((RANDOM % 6 + 2))
          done
          echo "Failed to push after retries"; exit 1
